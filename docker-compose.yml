# Example for a home server reached over Tailscale. See docs/self-hosting.md.
services:
  inlark:
    build: .
    image: inlark-web
    restart: unless-stopped
    ports:
      # Publish only on the server's Tailscale address, not on every interface.
      # Replace 100.x.y.z with the address from `tailscale ip -4`.
      - '100.x.y.z:8080:8080'
    environment:
      # Leave unset to choose a password in the browser on first visit.
      # INLARK_PASSWORD: change-me
      # Set this when the site is served over HTTPS, for example by `tailscale serve`.
      # INLARK_SECURE_COOKIE: 'true'
    volumes:
      - inlark-data:/data
volumes:
  inlark-data:
